<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartnerLinks | Connect Shopify</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <p class="eyebrow">PartnerLinks</p>
      <h1>Connect your Shopify store</h1>
      <p>Install PartnerLinks to start setting creator commission terms and referral infrastructure.</p>
      <form class="auth-form" action="/api/shopify/start" method="GET">
        <label for="shop">Shopify store domain</label>
        <input id="shop" name="shop" type="text" placeholder="your-store.myshopify.com" autocomplete="organization" required>
        <button class="auth-primary-button" type="submit">Connect Shopify</button>
      </form>
    </section>
  </main>
</body>
</html>
