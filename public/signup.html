<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join PartnerLinks</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/support-widget.css?v=1">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <p class="eyebrow">PartnerLinks</p>
      <h1>Join PartnerLinks as a creator</h1>
      <p id="invite-context">Create your creator account and get your invite link.</p>
      <a id="google-button" class="auth-primary-button" href="/auth/google/start">Continue with Google</a>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const invite = params.get('invite');
    const brand = params.get('brand');
    const button = document.getElementById('google-button');
    const context = document.getElementById('invite-context');

    if (invite) {
      button.href = `/auth/google/start?invite=${encodeURIComponent(invite)}`;
      context.textContent = `You were invited by ${invite}. Continue with Google to create your creator account.`;
    } else if (brand) {
      context.textContent = 'You were invited by a PartnerLinks brand. Continue with Google to create your creator account.';
    }
  </script>
  <script src="/support-knowledge-base.js?v=1" defer></script>
  <script src="/support-widget.js?v=1" defer></script>
</body>
</html>
